<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rulebook — Ayakucho</title>
  <meta name="description" content="The Ayakucho rulebook — design in progress, coming soon." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=15" />

  <style>
    body { padding-top: 0; }
    .rb {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .rb-card {
      text-align: center;
      max-width: 460px;
      width: 100%;
      background: var(--ink);
      border: 3px solid var(--gold);
      border-radius: 10px;
      padding: 44px 30px 40px;
      color: var(--cream);
    }
    .rb-card__icon { font-size: 2.8rem; line-height: 1; margin-bottom: 12px; }
    .rb-card__title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.9rem, 6vw, 2.5rem);
      margin: 0 0 10px;
      color: var(--gold);
    }
    .rb-card__msg {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.1rem, 3.4vw, 1.35rem);
      margin: 0;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main class="rb">
    <section class="rb-card">
      <div class="rb-card__icon" aria-hidden="true">&#128214;</div>
      <h1 class="rb-card__title">The Ayakucho Rulebook</h1>
      <p class="rb-card__msg">Design in progress — coming soon.</p>
    </section>
  </main>
</body>
</html>
