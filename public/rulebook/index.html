<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rulebook — Ayakucho</title>
  <meta name="description" content="Download the Ayakucho rulebook — free." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=15" />

  <style>
    body { padding-top: 0; }
    .rb {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .rb-card {
      text-align: center;
      max-width: 500px;
      width: 100%;
      background: var(--ink);
      border: 3px solid var(--gold);
      border-radius: 10px;
      padding: 42px 30px 38px;
      color: var(--cream);
    }
    .rb-card__icon { font-size: 2.8rem; line-height: 1; margin-bottom: 12px; }
    .rb-card__title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.8rem, 5.5vw, 2.3rem);
      margin: 0 0 16px;
      color: var(--gold);
    }
    .rb-card__msg {
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 auto 26px;
      max-width: 42ch;
      opacity: 0.92;
    }
    .rb-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .rb-actions .btn { width: auto; }
    .btn--gold { background: var(--gold); color: var(--ink); }
    .btn--gold:hover { background: #b3862c; }
    .btn--ghost {
      background: transparent;
      color: var(--cream);
      border: 2px solid var(--gold);
      padding: 12px 24px;
    }
    .btn--ghost:hover { background: rgba(199, 154, 59, 0.15); }
  </style>
</head>
<body>
  <main class="rb">
    <section class="rb-card">
      <div class="rb-card__icon" aria-hidden="true">&#128214;</div>
      <h1 class="rb-card__title">The Ayakucho Rulebook</h1>
      <p class="rb-card__msg">This rulebook is in progress: it needs to be proofread, translated and be added illustrations, which Maja is currently working on. For now, enjoy the ugly essentials by downloading it for free below.</p>
      <div class="rb-actions">
        <a class="btn btn--gold" href="/rulebook.pdf" download="Ayakucho-Rulebook.pdf">Download the rulebook (PDF)</a>
        <a class="btn btn--ghost" href="/rulebook.pdf" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    </section>
  </main>
</body>
</html>
